name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify versionName, versionCode, and companion __version__
        id: check
        run: |
          RAW_TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag '$RAW_TAG' does not match vMAJOR.MINOR.PATCH"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))

          grep -q "versionName = \"$VERSION\"" app/build.gradle.kts || {
            echo "app/build.gradle.kts versionName does not match $VERSION"
            exit 1
          }
          grep -q "versionCode = $CODE" app/build.gradle.kts || {
            echo "app/build.gradle.kts versionCode does not match $CODE"
            exit 1
          }
          grep -q "__version__ = \"$VERSION\"" companion/minifile_companion/__init__.py || {
            echo "companion/minifile_companion/__init__.py __version__ does not match $VERSION"
            exit 1
          }
          grep -q "^version = \"$VERSION\"" pyproject.toml || {
            echo "pyproject.toml version does not match $VERSION"
            exit 1
          }
          grep -q "^version = \"$VERSION\"" companion/pyproject.toml || {
            echo "companion/pyproject.toml version does not match $VERSION"
            exit 1
          }

          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

  android:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Restore consistent signing keystore (fail fast if missing)
        env:
          KS_B64: ${{ secrets.MINIFILE_DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$KS_B64" || {
            echo "Missing MINIFILE_DEBUG_KEYSTORE_B64 secret; refusing to publish differently-signed APK"
            exit 1
          }
          mkdir -p "$HOME/.android"
          printf '%s' "$KS_B64" | base64 -d > "$HOME/.android/debug.keystore"
          # Pin the signing identity: v1.0.13 was published with a secret holding a
          # different debug keystore (SHA-1 FF:96:2D:...), which made the in-app
          # updater of earlier builds reject it. Never publish with any other key.
          EXPECTED_SHA256="A2:BE:41:F8:D6:D8:AD:E3:F4:C4:CC:61:82:59:11:4B:C1:C5:0A:98:F9:40:32:EA:5A:C9:4C:31:06:28:DC:F5"
          EXPECTED_SHA1="F5:D0:CC:CF:DA:49:44:0B:BB:54:22:CB:88:0F:C8:C6:81:66:A6:54"
          KEYTOOL_OUT=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey) || {
            echo "Unable to read androiddebugkey from restored keystore; refusing to publish"
            exit 1
          }
          ACTUAL_SHA256=$(printf '%s\n' "$KEYTOOL_OUT" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n1 | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          ACTUAL_SHA1=$(printf '%s\n' "$KEYTOOL_OUT" | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' | head -n1 | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          echo "Restored keystore SHA-256: $ACTUAL_SHA256"
          echo "Restored keystore SHA-1:   $ACTUAL_SHA1"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Signing keystore SHA-256 mismatch (expected $EXPECTED_SHA256, got ${ACTUAL_SHA256:-<none>}); refusing to publish differently-signed APK"
            exit 1
          fi
          if [ -n "$ACTUAL_SHA1" ] && [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Signing keystore SHA-1 mismatch (expected $EXPECTED_SHA1, got $ACTUAL_SHA1); refusing to publish differently-signed APK"
            exit 1
          fi
      - name: Build and unit-test Android app
        run: |
          ./gradlew assembleRelease testDebugUnitTest --no-daemon
          # Double-check the produced APK is signed with the pinned certificate.
          if [ -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          else
            APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)
          fi
          if [ -n "$APKSIGNER" ]; then
            APKSIGNER_OUT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk)
            printf '%s\n' "$APKSIGNER_OUT"
            APK_SHA256=$(printf '%s\n' "$APKSIGNER_OUT" | sed -n 's/^.*certificate SHA-256 digest:[[:space:]]*//p' | head -n1 | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
            echo "APK signer SHA-256: $APK_SHA256"
            if [ "$APK_SHA256" != "a2be41f8d6d8ade3f4c4cc618259114bc1c50a98f94032ea5ac94c310628dcf5" ]; then
              echo "::error::Release APK signer SHA-256 mismatch (got ${APK_SHA256:-<none>}); refusing to publish"
              exit 1
            fi
          else
            echo "::warning::apksigner not found; relying on keystore fingerprint check"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/minifile-${{ needs.verify-version.outputs.tag }}-release.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/minifile-${{ needs.verify-version.outputs.tag }}-release.apk

  companion:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and package PC Companion
        run: |
          python3 -m unittest discover -s companion/tests -v
          mkdir -p dist
          zip -r "dist/minifile-companion-${{ needs.verify-version.outputs.tag }}.zip" companion -x 'companion/tests/*' '*/__pycache__/*' '*.pyc' 'companion/build/*' 'companion/dist/*' 'companion/*.egg-info/*'
      - uses: actions/upload-artifact@v4
        with:
          name: companion-zip
          path: dist/minifile-companion-${{ needs.verify-version.outputs.tag }}.zip

  release:
    needs: [verify-version, android, companion]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Compute SHA256SUMS.txt with basenames
        run: |
          cd dist
          sha256sum *.apk *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or idempotently populate GitHub Release without clobbering existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            EXISTING=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
            for f in minifile-"$TAG"-release.apk minifile-companion-"$TAG".zip SHA256SUMS.txt; do
              if echo "$EXISTING" | grep -Fxq "$f"; then
                echo "Skipping already-uploaded asset: $f"
              else
                echo "Uploading missing asset: $f"
                gh release upload "$TAG" "$f" --repo "$REPO"
              fi
            done
          else
            gh release create "$TAG" \
              minifile-"$TAG"-release.apk \
              minifile-companion-"$TAG".zip \
              SHA256SUMS.txt \
              --repo "$REPO" \
              --title "MiniFile $TAG" \
              --generate-notes \
              --latest
          fi
